<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#552c59">
  <title>Tidak ada koneksi — Aplikasi HC</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fbf8fc; color: #231a28; font-family: Arial, Helvetica, sans-serif; }
    main { width: 100%; max-width: 380px; }
    .bar { width: 48px; height: 5px; border-radius: 3px; background: #fdef0a; box-shadow: 0 0 0 1px rgba(85, 44, 89, .2); margin-bottom: 20px; }
    img { width: 180px; height: auto; display: block; }
    h1 { margin: 24px 0 0; font-size: 28px; font-weight: 800; }
    p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #6a5f72; }
    button { margin-top: 24px; width: 100%; border: 0; border-radius: 999px; padding: 13px 16px; background: #552c59; color: #fff; font: 700 15px Arial, Helvetica, sans-serif; cursor: pointer; }
    button:hover { background: #3d1f40; }
  </style>
</head>
<body>
  <main>
    <div class="bar"></div>
    <img src="/logo-cbp.png" alt="PT Cahaya Bukit Perunggu">
    <h1>Tidak ada koneksi</h1>
    <p>Aplikasi HC memerlukan internet. Periksa jaringan Anda, lalu coba lagi. Data yang belum disimpan di layar sebelumnya tidak tersimpan.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
