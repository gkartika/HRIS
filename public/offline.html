<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#552c59">
  <title>Tidak ada koneksi — SAPA</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fbf8fc; color: #231a28; font-family: Arial, Helvetica, sans-serif; }
    main { width: 100%; max-width: 380px; }
    .bar { width: 48px; height: 5px; border-radius: 3px; background: #fdef0a; box-shadow: 0 0 0 1px rgba(85, 44, 89, .2); margin-bottom: 20px; }
    img { width: 88px; height: 88px; display: block; border-radius: 20px; }
    h1 { margin: 24px 0 0; font-size: 28px; font-weight: 800; }
    p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #6a5f72; }
    .status { margin-top: 16px; font-size: 13.5px; color: #552c59; font-weight: 600; }
    button { margin-top: 20px; width: 100%; border: 0; border-radius: 999px; padding: 13px 16px; background: #552c59; color: #fff; font: 700 15px Arial, Helvetica, sans-serif; cursor: pointer; }
    button:hover { background: #3d1f40; }
  </style>
</head>
<body>
  <main>
    <div class="bar"></div>
    <img src="/pwa/icon-192.png" alt="SAPA">
    <h1>Belum tersambung</h1>
    <p>SAPA memerlukan internet. Periksa jaringan Anda. Halaman ini mencoba menyambung lagi sendiri, dan akan terbuka begitu koneksi kembali. Data yang belum disimpan di layar sebelumnya tidak tersimpan.</p>
    <p class="status" id="status" role="status">Mencoba menyambung kembali…</p>
    <button type="button" onclick="location.reload()">Coba lagi sekarang</button>
  </main>
  <script>
    // Phones often show this page only because the network was still waking up. Keep asking the server (a tiny
    // request) and open the page the moment it answers.
    (function () {
      var tries = 0;
      function check() {
        tries++;
        fetch("/api/version", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) return;
            // opened by the service worker in place of the page that failed: reload that page; opened directly: go home
            if (location.pathname === "/offline.html") location.replace("/");
            else location.reload();
          })
          .catch(function () {
            var s = document.getElementById("status");
            if (s) s.textContent = "Masih belum tersambung. Mencoba lagi… (" + tries + ")";
          });
      }
      window.addEventListener("online", check);
      setInterval(check, 3000);
      setTimeout(check, 800);
    })();
  </script>
</body>
</html>
